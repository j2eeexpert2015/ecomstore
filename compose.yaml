services:
  mysql:
    image: mysql:8.4
    container_name: ecomstore-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ecomstore_db
      MYSQL_USER: ecomstore
      MYSQL_PASSWORD: ecomstore
    volumes:
      - ecomstore_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpassword", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  ecomstore_mysql_data:
